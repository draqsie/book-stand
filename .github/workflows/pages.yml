name: GitHub Pages'e yayımla

# Yayımlanacak dal: varsayılan "main". Başka bir dal için aşağıdaki listeyi değiştirin
# ve README'deki "Yayın dalını değiştirme" adımlarını izleyin.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Siteyi hazırla (_site)
        run: node tools/build.mjs
      - name: Dağıtım yapısını denetle
        run: node tools/check-deploy.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
